name: Build Windows josecast_core.pyd

on:
  push:
    branches:
      - 'devin/**'
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip nanobind numpy

      - name: Setup vcpkg and build C++ dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'b2cb0da531c2f1f740045bfe7c4dac59f0b2b69c'
          vcpkgJsonGlob: '**/cpp/vcpkg.json'
          runVcpkgInstall: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S cpp `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          $bin = "${{ github.workspace }}\vcpkg\installed\x64-windows\bin"
          if (Test-Path $bin) {
            New-Item -ItemType Directory -Force -Path win_dlls | Out-Null
            Copy-Item "$bin\*.dll" win_dlls\ -Force
          }

      - name: Show produced files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "josecast_core*.pyd" | Select-Object FullName

      - name: Upload .pyd and DLLs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: josecast_core_windows
          path: |
            core/josecast_core*.pyd
            win_dlls/*.dll
