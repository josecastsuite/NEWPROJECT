name: Build Windows josecast_core.pyd

on:
  push:
    branches:
      - 'devin/**'
      - main
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: '${{ github.workspace }}\vcpkg_installed'
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\vcpkg_binary_cache,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip nanobind numpy

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\vcpkg_installed
            ${{ github.workspace }}\vcpkg_binary_cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('cpp/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('cpp/vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Setup vcpkg and build C++ dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
          vcpkgJsonGlob: '**/cpp/vcpkg.json'
          runVcpkgInstall: true
          binaryCachePath: '${{ github.workspace }}\vcpkg_binary_cache'

      - name: Enable MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S cpp `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          $bin = "${{ github.workspace }}\vcpkg_installed\x64-windows\bin"
          if (Test-Path $bin) {
            New-Item -ItemType Directory -Force -Path win_dlls | Out-Null
            Copy-Item "$bin\*.dll" win_dlls\ -Force
            Get-ChildItem win_dlls\*.dll | Select-Object FullName
          }

      - name: Show produced files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "josecast_core*.pyd" | Select-Object FullName
          if (Test-Path "win_dlls") { Get-ChildItem win_dlls\*.dll | Select-Object FullName }

      - name: Upload .pyd and DLLs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: josecast_core_windows
          path: |
            core/josecast_core*.pyd
            win_dlls/*.dll
